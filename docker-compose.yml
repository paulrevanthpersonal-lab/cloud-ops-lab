services:
  operations-lab:
    image: python:3.13-alpine
    working_dir: /app
    command: python server.py
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - lab-data:/app/data/runtime
    environment:
      CLOUD_LAB_DB: /app/data/runtime/lab_runs.db
    read_only: true
    tmpfs:
      - /tmp
volumes:
  lab-data:
